name: Production Check and Deploy
on:
  push:
    branches: [main]
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run typecheck
      - name: Deploy to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0da2b460d6c2756f2fcc5cbfeb9e01ca
      - name: Explain missing Cloudflare token
        if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "Deployment skipped. Add CLOUDFLARE_API_TOKEN in GitHub repository Actions secrets."
